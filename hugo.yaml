baseURL: "https://mulrooney.me/"
languageCode: "en-ca"
title: "Devin Mulrooney"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "Devin Mulrooney"
  description: "Infrastructure notes, homelab projects, and professional development."
  author: "Devin Mulrooney"
  keywords: ["infrastructure", "homelab", "azure", "linux", "powershell", "sysadmin"]

  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  TocOpen: false
  comments: false

  homeInfoParams:
    Title: "Infrastructure, homelab, and the occasional war story"
    Content: >
      I'm an infrastructure manager in Edmonton, Alberta. I spend my days on hybrid
      Azure and on-premises environments, and my evenings on a homelab that keeps
      finding new ways to be interesting. This is where I write up what I build and
      what breaks.

  socialIcons:
    - name: github
      url: "https://github.com/devinmm"
    - name: linkedin
      url: "https://www.linkedin.com/in/devinmm/"
    - name: email
      url: "mailto:devin@mulrooney.me"
    - name: rss
      url: "index.xml"

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai

outputs:
  home:
    - HTML
    - RSS
    - JSON
